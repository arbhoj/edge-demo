apiVersion: v1
kind: ConfigMap
metadata:
  name: globalmainpage
  namespace: default
data:
  index.html: |
    <html>
        <head>
            <title>Edge-1 Online!!</title>
            <meta http-equiv="refresh" content="5">
            <style>
                * {
                    margin: 0;
                    padding: 0;
                }
                .imgbox {
                    display: grid;
                    height: 100%;
                }
                .center-fit {
                    max-width: 100%;
                    max-height: 100vh;
                    margin: auto;
                }
            </style>        
        </head>
            <body>
                <h1>{{ include "dynamic.clusterName" . }} Online!!</h1>
                <div class="imgbox">
                    <img src="https://raw.githubusercontent.com/arbhoj/edge-demo/refs/heads/main/images/welcome_to_edge_medium.gif">
                </div>
            </body>
    </html>