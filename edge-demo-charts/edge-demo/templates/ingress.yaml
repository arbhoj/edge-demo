apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: helloedge-ingress
  namespace: {{ .Release.Namespace }}
  annotations:
    kubernetes.io/ingress.class: kommander-traefik
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-helloedge-stripprefixes@kubernetescrd
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  rules:
  - http:
      paths:
      - backend:
          service:
            name: helloedge
            port:
              number: 80
        path: /helloedge
        pathType: Prefix
